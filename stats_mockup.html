<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskora Stats Mockup</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 360px;
            height: 640px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .chart-placeholder {
            height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding-bottom: 10px;
        }
        .bar {
            flex: 1;
            background: linear-gradient(to top, #3b82f6, #8b5cf6);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }
        .days {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #64748b;
        }
        .bottom-nav {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 24px;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            background: #475569;
            border-radius: 6px;
        }
        .nav-icon.active {
            background: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Statistics</div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value">84%</div>
                <div class="stat-label">Completion Rate</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">12</div>
                <div class="stat-label">Tasks Done Today</div>
            </div>
        </div>

        <div class="card">
            <div style="margin-bottom: 12px; font-weight: 600;">Weekly Progress</div>
            <div class="chart-placeholder">
                <div class="bar" style="height: 40%;"></div>
                <div class="bar" style="height: 70%;"></div>
                <div class="bar" style="height: 55%;"></div>
                <div class="bar" style="height: 90%;"></div>
                <div class="bar" style="height: 65%;"></div>
                <div class="bar" style="height: 80%;"></div>
                <div class="bar" style="height: 45%;"></div>
            </div>
            <div class="days">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
        </div>

        <div class="card">
            <div style="margin-bottom: 12px; font-weight: 600;">Category Breakdown</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; font-size: 14px;">
                    <span>Work</span>
                    <span>45%</span>
                </div>
                <div style="height: 6px; background: #334155; border-radius: 3px; overflow: hidden;">
                    <div style="width: 45%; height: 100%; background: #60a5fa;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 4px;">
                    <span>Personal</span>
                    <span>30%</span>
                </div>
                <div style="height: 6px; background: #334155; border-radius: 3px; overflow: hidden;">
                    <div style="width: 30%; height: 100%; background: #a855f7;"></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-icon"></div>
            <div class="nav-icon"></div>
            <div class="nav-icon active"></div>
            <div class="nav-icon"></div>
        </div>
    </div>
</body>
</html>
